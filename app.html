<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLNTD — App</title>
<link rel="icon" type="image/png" href="assets/icon.png?v=2" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800;9..144,900&family=Archivo:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    --phone-w: 320px;
    --phone-h: 672px;
    --phone-radius: 46px;
    --showcase-gap: 72px;
    --copy-max: 520px;
    --content-scale: 1;
    --headline-scale: 1;
    --body-scale: 1;
    /* The app screens (screens.jsx) use absolute px sizes tuned for a real
       ~400px-wide phone. The mock's screen is narrower, so we render the
       screen content at --screen-design-w and scale it down to fit — this
       de-zooms the content so it matches the real device's proportions. */
    --screen-design-w: 400px;
    --screen-scale: 1;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow-x: hidden; }
  body {
    background: #1D391A;
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* ─── SECTION WRAPPER ───────────────────── */
  .showcase-section {
    width: 100%;
    height: calc(100vh - 64px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    position: relative;
    overflow: hidden;
  }

  /* subtle grain texture */
  .showcase-section::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    opacity: 0.5;
  }

  /* ─── LAYOUT ────────────────────────────── */
  .showcase-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--showcase-gap);
    transform: scale(var(--content-scale));
    transform-origin: center center;
    max-width: 1240px;
    width: 100%;
    margin: 0 auto;
    padding: 0 24px;
    position: relative;
    z-index: 1;
  }

  /* ─── LEFT COPY ─────────────────────────── */
  .copy-col {
    flex: 0 1 var(--copy-max);
    min-width: 0;
    text-align: left;
  }

  .eyebrow {
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.28em;
    color: rgba(248,243,238,0.55);
    margin-bottom: 20px;
    text-align: left;
  }

  .headline {
    transform: scale(var(--headline-scale));
    transform-origin: left top;
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: clamp(42px, 5vw, 68px);
    color: #F8F3EE;
    line-height: 1.0;
    letter-spacing: -0.03em;
    margin-bottom: 24px;
  }

  .headline em {
    font-style: italic;
    color: #CBA258;
  }

  .subtext {
    transform: scale(var(--body-scale));
    transform-origin: left top;
    font-family: 'Inter', sans-serif;
    font-size: 17px;
    color: rgba(248,243,238,0.65);
    line-height: 1.65;
    max-width: 400px;
    margin-bottom: 48px;
  }

  .feature-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 48px;
  }

  .feature-item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }

  .feature-dot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(63,140,63,0.25);
    border: 1.5px solid rgba(63,140,63,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .feature-star {
    color: #3F8C3F;
    font-size: 13px;
    line-height: 1;
  }

  .feature-text {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    color: rgba(248,243,238,0.8);
    line-height: 1.45;
  }

  .feature-text strong {
    color: #F8F3EE;
    font-weight: 600;
  }

  /* App store badges */
  .store-badges {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }

  .badge {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(248,243,238,0.08);
    border: 1.5px solid rgba(248,243,238,0.15);
    border-radius: 12px;
    padding: 10px 18px;
    cursor: pointer;
    transition: all 180ms cubic-bezier(0.22, 1, 0.36, 1);
    text-decoration: none;
  }

  .badge:hover {
    background: rgba(248,243,238,0.14);
    border-color: rgba(248,243,238,0.3);
    transform: translateY(-1px);
  }

  .badge-label {
    display: flex;
    flex-direction: column;
  }

  .badge-sub {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    color: rgba(248,243,238,0.55);
    letter-spacing: 0.02em;
  }

  .badge-name {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: #F8F3EE;
    letter-spacing: -0.01em;
  }

  /* ─── PHONE COLUMN ──────────────────────── */
  .phone-col {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  /* ─── PHONE FRAME ───────────────────────── */
  .phone-bezel {
    width: var(--phone-w);
    height: var(--phone-h);
    background: #0F0F0F;
    border-radius: var(--phone-radius);
    padding: 10px;
    box-shadow:
      0 0 0 1px #2a2a2a,
      0 40px 100px rgba(0,0,0,0.55),
      0 12px 32px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.06);
    position: relative;
  }

  /* Side buttons */
  .phone-bezel::before {
    content: '';
    position: absolute;
    left: -3px;
    top: 100px;
    width: 3px;
    height: 36px;
    background: #1a1a1a;
    border-radius: 2px 0 0 2px;
    box-shadow: 0 48px 0 #1a1a1a, 0 96px 0 #1a1a1a;
  }

  .phone-bezel::after {
    content: '';
    position: absolute;
    right: -3px;
    top: 140px;
    width: 3px;
    height: 60px;
    background: #1a1a1a;
    border-radius: 0 2px 2px 0;
  }

  .phone-screen-wrap {
    width: 100%;
    height: 100%;
    border-radius: 38px;
    overflow: hidden;
    background: #fff;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* Status bar */
  .phone-status {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    flex-shrink: 0;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    z-index: 10;
    position: relative;
  }

  .phone-status.dark { background: #1D391A; color: #fff; }
  .phone-status.light { background: #fff; color: #14230E; }

  .sb-right { display: flex; gap: 5px; align-items: center; }
  .sb-bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 10px; }
  .sb-bars span { width: 3px; background: currentColor; border-radius: 1px; opacity: 0.85; }
  .sb-bars span:nth-child(1) { height: 3px; }
  .sb-bars span:nth-child(2) { height: 5px; }
  .sb-bars span:nth-child(3) { height: 7px; }
  .sb-bars span:nth-child(4) { height: 10px; }

  /* Screen slide area */
  .screen-slider {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .screen-slide {
    position: absolute;
    top: 0;
    left: 0;
    width: var(--screen-design-w);
    height: calc(100% / var(--screen-scale));
    transform: scale(var(--screen-scale));
    transform-origin: top left;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: none;
    opacity: 0;
    pointer-events: none;
    transition: opacity 420ms cubic-bezier(0.22, 1, 0.36, 1);
    will-change: opacity;
  }

  .screen-slide::-webkit-scrollbar { display: none; }
  .screen-slide.current { opacity: 1; pointer-events: auto; }
  .screen-slide.exiting { opacity: 0; }

  /* Tab bar */
  .phone-tabbar {
    display: flex;
    background: #fff;
    border-top: 0.5px solid #ececec;
    padding: 10px 0 4px;
    flex-shrink: 0;
  }

  .phone-tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    padding: 2px;
    transition: opacity 150ms;
  }

  .phone-tab-label {
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    font-weight: 600;
  }

  /* Home indicator */
  .home-indicator {
    height: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fff;
    flex-shrink: 0;
  }

  .home-bar {
    width: 120px;
    height: 4px;
    background: rgba(0,0,0,0.8);
    border-radius: 999px;
  }

  /* ─── SCREEN INDICATOR DOTS ─────────────── */
  .screen-indicators {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .dot {
    height: 6px;
    border-radius: 999px;
    background: rgba(248,243,238,0.3);
    transition: all 320ms cubic-bezier(0.22, 1, 0.36, 1);
    cursor: pointer;
  }

  .dot.active {
    background: #CBA258;
    width: 24px !important;
  }

  .screen-label-text {
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: rgba(248,243,238,0.45);
    margin-top: 2px;
  }

  /* Monstera decorative elements */
  .leaf-deco {
    position: absolute;
    opacity: 0.06;
    pointer-events: none;
  }

  .app-nav-hamburger { display: none; width: 40px; height: 40px; border-radius: 999px; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; color: #14230E; transition: background 120ms; }
  .app-nav-hamburger svg { width: 22px; height: 22px; }
  .app-nav-hamburger:hover { background: #ECE4D8; }
  .app-mobile-overlay { position: fixed; inset: 0; background: rgba(20,35,14,0.4); z-index: 100; opacity: 0; pointer-events: none; transition: opacity 240ms cubic-bezier(0.22,1,0.36,1); }
  .app-mobile-overlay.open { opacity: 1; pointer-events: auto; }
  .app-mobile-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 300px; max-width: 85vw; background: #F8F3EE; z-index: 101; transform: translateX(100%); transition: transform 240ms cubic-bezier(0.22,1,0.36,1); display: flex; flex-direction: column; box-shadow: -8px 0 32px rgba(0,0,0,0.12); }
  .app-mobile-drawer.open { transform: translateX(0); }
  .app-mobile-head { padding: 0 20px; height: 64px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E8E1D4; }
  .app-mobile-close { width: 40px; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; color: #14230E; }
  .app-mobile-close svg { width: 22px; height: 22px; }
  .app-mobile-links { display: flex; flex-direction: column; padding: 8px 24px; }
  .app-mobile-links a { font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 0.05em; text-transform: uppercase; color: #14230E; padding: 20px 0; border-bottom: 1px solid #E8E1D4; text-decoration: none; transition: color 120ms; }
  .app-mobile-links a:last-child { border-bottom: 0; }
  .app-mobile-links a:hover, .app-mobile-links a.active { color: #1D391A; }

  @media (max-width: 900px) {
    body { overflow-x: hidden; }
    .app-nav-links { display: none !important; }
    .app-nav-hamburger { display: flex; }
    .showcase-section { display: block; height: auto; min-height: 0; overflow: visible; padding: 40px 0 64px; }
    .showcase-inner { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 44px; transform: none !important; width: 100%; max-width: 100%; margin: 0; padding: 0 24px; }
    .copy-col { text-align: left; transform: none !important; flex: 0 0 auto; width: 100%; max-width: 100%; }
    .headline { transform: none !important; }
    .phone-col { transform: none !important; align-self: center; flex: 0 0 auto; margin-top: 28px; }
    .phone-bezel { width: min(320px, 78vw); height: auto; aspect-ratio: 320 / 672; }
    .subtext { max-width: 100%; transform: none !important; }
    .feature-list { align-items: flex-start; }
    .store-badges { justify-content: flex-start; }
  }
</style>
</head>

<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel">

const { useState, useEffect, useRef } = React;

// PLNTD theme
const T = {
  dark: '#1D391A', darkDeep: '#14230E', onDarkSoft: 'rgba(233,243,233,0.7)',
  surface: '#FFFFFF', cream: '#F8F3EE',
  ink: '#14230E', inkMuted: 'rgba(20,35,14,0.65)', inkFaint: 'rgba(20,35,14,0.4)',
  primary: '#1D391A', leaf: '#3F8C3F', leafSoft: '#E9F3E9', gold: '#CBA258',
  border: '#E8E1D4'
};

const APP_TABS = [
{ id: 'Home', label: 'Home', dark: true },
{ id: 'Scan', label: 'Scan', dark: false },
{ id: 'Rewards', label: 'Rewards', dark: false },
{ id: 'Menu', label: 'Menu', dark: false }];


const INTERVAL_MS = 3200;

const APP_TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "phoneWidth": 330,
  "phoneHeight": 730,
  "showcaseGap": 112,
  "copyWidth": 520,
  "autoplay": true,
  "contentScale": 105,
  "phoneOffsetX": -190,
  "phoneOffsetY": 25,
  "textOffsetX": -135,
  "textOffsetY": 20,
  "headlineSize": 110,
  "bodySize": 115,
  "phoneScale": 90
} /*EDITMODE-END*/;

function StatusBar({ dark }) {
  return (
    <div className={`phone-status ${dark ? 'dark' : 'light'}`}>
      <span>9:41</span>
      <div className="sb-right">
        <div className="sb-bars"><span /><span /><span /><span /></div>
        <span style={{ fontSize: '11px' }}>5G</span>
        <svg width="22" height="11" viewBox="0 0 22 11" style={{ opacity: 0.85 }}>
          <rect x="0" y="0" width="19" height="11" rx="3" fill="none" stroke="currentColor" strokeWidth="1.2" />
          <rect x="19.5" y="3.5" width="2" height="4" rx="1" fill="currentColor" />
          <rect x="1.5" y="1.5" width="14" height="8" rx="1.5" fill="currentColor" />
        </svg>
      </div>
    </div>);

}

function TabBar({ activeScreen, onNavigate }) {
  const icons = {
    Home: { active: 'ion-home', inactive: 'ion-home-outline' },
    Scan: { active: 'ion-qr', inactive: 'ion-qr-outline' },
    Rewards: { active: 'ion-star', inactive: 'ion-star-outline' },
    Menu: { active: 'ion-restaurant', inactive: 'ion-restaurant-outline' }
  };
  return (
    <div className="phone-tabbar">
      {APP_TABS.map((tab) => {
        const active = tab.id === activeScreen;
        const color = active ? T.leaf : '#8A8A8A';
        return (
          <div key={tab.id} className="phone-tab" onClick={() => onNavigate(tab.id)}>
            <Icon name={active ? icons[tab.id].active : icons[tab.id].inactive} size={22} color={color} />
            <span className="phone-tab-label" style={{ color }}>{tab.label}</span>
          </div>);

      })}
    </div>);

}

function PhoneShowcase() {
  const [activeIdx, setActiveIdx] = useState(0);
  const [t, setTweak] = useTweaks(APP_TWEAK_DEFAULTS);

  React.useEffect(() => {
    const r = document.documentElement;
    r.style.setProperty('--phone-w', t.phoneWidth + 'px');
    r.style.setProperty('--phone-h', t.phoneHeight + 'px');
    r.style.setProperty('--phone-radius', Math.round(t.phoneWidth * 0.144) + 'px');
    // De-zoom: render app screens at SCREEN_DESIGN_W and scale to the real
    // screen width (phone width minus the 10px bezel padding each side).
    const SCREEN_DESIGN_W = 400;
    r.style.setProperty('--screen-design-w', SCREEN_DESIGN_W + 'px');
    r.style.setProperty('--screen-scale', ((t.phoneWidth - 20) / SCREEN_DESIGN_W).toString());
    r.style.setProperty('--showcase-gap', t.showcaseGap + 'px');
    r.style.setProperty('--copy-max', t.copyWidth + 'px');
    r.style.setProperty('--headline-scale', (t.headlineSize / 100).toString());
    r.style.setProperty('--body-scale', (t.bodySize / 100).toString());
  }, [t]);

  // Auto-fit: scale .showcase-inner to fit within the section without scroll
  React.useEffect(() => {
    const section = document.querySelector('.showcase-section');
    const inner = document.querySelector('.showcase-inner');
    if (!section || !inner) return;
    function fit() {
      inner.style.transform = 'none';
      if (window.innerWidth <= 900) return;
      const sH = section.clientHeight;
      const sW = section.clientWidth;
      const iH = inner.scrollHeight;
      const iW = inner.scrollWidth;
      const scaleY = sH / (iH + 32);
      const scaleX = sW / (iW + 32);
      const s = Math.min(scaleY, scaleX, 1);
      const final = s * (t.contentScale / 100);
      inner.style.transform = `scale(${final})`;
    }
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, [t]);
  const [paused, setPaused] = useState(false);
  const timerRef = useRef(null);

  const goTo = (idx) => {
    if (idx === activeIdx) return;
    setActiveIdx(idx);
  };

  const advance = () => {
    setActiveIdx((prev) => (prev + 1) % APP_TABS.length);
  };

  useEffect(() => {
    if (paused) return;
    timerRef.current = setInterval(advance, INTERVAL_MS);
    return () => clearInterval(timerRef.current);
  }, [paused]);

  const activeTab = APP_TABS[activeIdx];

  const renderScreen = (id) => {
    const noop = () => {};
    switch (id) {
      case 'Home':return <HomeScreen t={T} onNavigate={noop} />;
      case 'Scan':return <ScanScreen t={T} onNavigate={noop} />;
      case 'Rewards':return <RewardsScreen t={T} onNavigate={noop} />;
      case 'Menu':return <MenuScreen t={T} onNavigate={noop} />;
      default:return null;
    }
  };

  return (
    <>
      <section className="showcase-section">
      {/* Decorative monstera leaves */}
      <svg className="leaf-deco" style={{ top: -80, right: -60, width: 400, height: 400 }} viewBox="0 0 200 200">
        <path d="M100 20 Q150 40 160 80 Q170 120 140 145 Q110 170 80 160 Q50 155 40 130 Q25 100 40 70 Q55 40 100 20Z" fill="#F8F3EE" />
        <line x1="100" y1="20" x2="90" y2="162" stroke="#1D391A" strokeWidth="2.5" />
        <line x1="97" y1="70" x2="148" y2="90" stroke="#1D391A" strokeWidth="1.5" />
        <line x1="95" y1="70" x2="45" y2="88" stroke="#1D391A" strokeWidth="1.5" />
        <line x1="93" y1="110" x2="145" y2="125" stroke="#1D391A" strokeWidth="1.2" />
        <line x1="93" y1="110" x2="44" y2="122" stroke="#1D391A" strokeWidth="1.2" />
      </svg>
      <svg className="leaf-deco" style={{ bottom: -60, left: -40, width: 300, height: 300 }} viewBox="0 0 200 200">
        <path d="M100 20 Q150 40 160 80 Q170 120 140 145 Q110 170 80 160 Q50 155 40 130 Q25 100 40 70 Q55 40 100 20Z" fill="#F8F3EE" />
        <line x1="100" y1="20" x2="90" y2="162" stroke="#1D391A" strokeWidth="2.5" />
        <line x1="97" y1="70" x2="148" y2="90" stroke="#1D391A" strokeWidth="1.5" />
        <line x1="95" y1="70" x2="45" y2="88" stroke="#1D391A" strokeWidth="1.5" />
      </svg>

      <div className="showcase-inner">
        {/* ─── LEFT COPY ─── */}
        <div className="copy-col" style={{ transform: `translate(${t.textOffsetX}px, ${t.textOffsetY}px)` }}>
          <div className="eyebrow">Now live · PLNTD Rewards</div>
          <h2 className="headline">
            Earn. Scan.<br /><em>Drink free.</em>
          </h2>
          <p className="subtext">
            Show your QR at the till, earn 1 point per transaction over £3, and hit 10 for a drink on the house. It's that simple.
          </p>

          <ul className="feature-list">
            <li className="feature-item">
              <div className="feature-dot"><span className="feature-star">★</span></div>
              <span className="feature-text"><strong>1 point per transaction over £3</strong> — scan your QR each time you visit</span>
            </li>
            <li className="feature-item">
              <div className="feature-dot"><span className="feature-star">★</span></div>
              <span className="feature-text"><strong>10 points = free drink</strong> — any smoothie, juice or coffee on the menu</span>
            </li>
            <li className="feature-item">
              <div className="feature-dot"><span className="feature-star">★</span></div>
              <span className="feature-text"><strong>Browse the full menu</strong> — fresh juices & smoothies, made on-site daily</span>
            </li>
          </ul>

          <div className="store-badges">
            {/* Apple App Store badge */}
            <a href="https://apps.apple.com/app/id6782877778" target="_blank" rel="noopener noreferrer" className="badge">
              <svg width="22" height="26" viewBox="0 0 384 512" fill="#F8F3EE">
                <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z" />
              </svg>
              <div className="badge-label">
                <span className="badge-sub">Download on the</span>
                <span className="badge-name">App Store</span>
              </div>
            </a>
            {/* Google Play badge */}
            <a href="https://play.google.com/store/apps/details?id=com.plntdco.plantd" target="_blank" rel="noopener noreferrer" className="badge">
              <svg width="24" height="26" viewBox="0 0 512 512">
                <path d="M48 432L284 256 48 80v352z" fill="#EA4335" />
                <path d="M48 80l236 176 68-50.8L96 48C76 36.5 56 49.3 48 80z" fill="#FBBC04" />
                <path d="M352 205.2L284 256l68 50.8 76-44C447.5 251.5 447.5 260.5 428 250l-76-44.8z" fill="#34A853" />
                <path d="M96 464l256-152.8-68-50.8L48 432c8 30.7 28 43.5 48 32z" fill="#4285F4" />
              </svg>
              <div className="badge-label">
                <span className="badge-sub">Get it on</span>
                <span className="badge-name">Google Play</span>
              </div>
            </a>
          </div>
          <div style={{ marginTop: 18, fontFamily: "'Inter', sans-serif", fontSize: 13, color: 'rgba(248,243,238,0.45)', lineHeight: 1.5 }}>Available now on iOS &amp; Android.

            </div>
          </div>
        </div>

        {/* ─── PHONE ─── */}
        <div className="phone-col" style={{ transform: `translate(${t.phoneOffsetX}px, ${t.phoneOffsetY}px) scale(${t.phoneScale / 100})`, transformOrigin: 'center center', position: 'relative' }}
        onMouseEnter={() => setPaused(true)}
        onMouseLeave={() => setPaused(false)}>
          
          <div className="phone-bezel">
            <div className="phone-screen-wrap">
              <StatusBar dark={activeTab.dark} />

              <div className="screen-slider">
                <div className="screen-slide current" key={activeTab.id}>
                  {renderScreen(activeTab.id)}
                </div>
              </div>

              <TabBar activeScreen={activeTab.id} onNavigate={(id) => {goTo(APP_TABS.findIndex((tab) => tab.id === id));setPaused(true);setTimeout(() => setPaused(false), 6000);}} />
              <div className="home-indicator"><div className="home-bar"></div></div>
            </div>
          </div>

          {/* Dots + label */}
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '10px' }}>
            <div className="screen-indicators">
              {APP_TABS.map((tab, idx) =>
              <div
                key={tab.id}
                className={`dot${idx === activeIdx ? ' active' : ''}`}
                style={{ width: idx === activeIdx ? '24px' : '6px' }}
                onClick={() => {goTo(idx);setPaused(true);setTimeout(() => setPaused(false), 6000);}} />

              )}
            </div>
            <div className="screen-label-text">{activeTab.label}</div>
          </div>
        </div>
    </section>
    <TweaksPanel title="Tweaks">
      <TweakSection title="Phone size">
        <TweakSlider label="Width" value={t.phoneWidth} min={240} max={400} step={10} onChange={(v) => setTweak('phoneWidth', v)} />
        <TweakSlider label="Height" value={t.phoneHeight} min={480} max={800} step={10} onChange={(v) => setTweak('phoneHeight', v)} />
      </TweakSection>
      <TweakSection title="Layout">
        <TweakSlider label="Gap between text & phone" value={t.showcaseGap} min={24} max={160} step={8} onChange={(v) => setTweak('showcaseGap', v)} />
        <TweakSlider label="Copy column width" value={t.copyWidth} min={300} max={680} step={20} onChange={(v) => setTweak('copyWidth', v)} />
        <TweakSlider label="Content scale" value={t.contentScale} min={60} max={120} step={5} onChange={(v) => setTweak('contentScale', v)} />
      </TweakSection>
      <TweakSection title="Text size">
        <TweakSlider label="Headline" value={t.headlineSize} min={60} max={150} step={5} onChange={(v) => setTweak('headlineSize', v)} />
        <TweakSlider label="Body text" value={t.bodySize} min={60} max={150} step={5} onChange={(v) => setTweak('bodySize', v)} />
      </TweakSection>
      <TweakSection title="Position">
        <TweakSlider label="Text horizontal" value={t.textOffsetX} min={-200} max={200} step={5} onChange={(v) => setTweak('textOffsetX', v)} />
        <TweakSlider label="Text vertical" value={t.textOffsetY} min={-200} max={200} step={5} onChange={(v) => setTweak('textOffsetY', v)} />
        <TweakSlider label="Phone horizontal" value={t.phoneOffsetX} min={-200} max={200} step={5} onChange={(v) => setTweak('phoneOffsetX', v)} />
        <TweakSlider label="Phone vertical" value={t.phoneOffsetY} min={-200} max={200} step={5} onChange={(v) => setTweak('phoneOffsetY', v)} />
        <TweakSlider label="Phone scale" value={t.phoneScale} min={50} max={150} step={5} onChange={(v) => setTweak('phoneScale', v)} />
      </TweakSection>
    </TweaksPanel>
    </>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<PhoneShowcase />);
</script>
</body>
</html>
