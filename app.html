<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLNTD — App</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800;9..144,900&family=Archivo:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #1D391A;
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* ─── SECTION WRAPPER ───────────────────── */
  .showcase-section {
    width: 100%;
    height: calc(100vh - 64px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 0;
    position: relative;
    overflow: hidden;
  }

  /* subtle grain texture */
  .showcase-section::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    opacity: 0.5;
  }

  /* ─── LAYOUT ────────────────────────────── */
  .showcase-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 72px;
    max-width: 1240px;
    width: 100%;
    margin: 0 auto;
    padding: 0 24px;
    position: relative;
    z-index: 1;
  }

  /* ─── LEFT COPY ─────────────────────────── */
  .copy-col {
    flex: 0 1 520px;
    min-width: 0;
    text-align: left;
  }

  .eyebrow {
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.28em;
    color: rgba(248,243,238,0.55);
    margin-bottom: 20px;
    text-align: left;
  }

  .headline {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: clamp(42px, 5vw, 68px);
    color: #F8F3EE;
    line-height: 1.0;
    letter-spacing: -0.03em;
    margin-bottom: 24px;
  }

  .headline em {
    font-style: italic;
    color: #CBA258;
  }

  .subtext {
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    color: rgba(248,243,238,0.65);
    line-height: 1.55;
    max-width: 400px;
    margin-bottom: 28px;
  }

  .feature-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 28px;
  }

  .feature-item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }

  .feature-dot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(63,140,63,0.25);
    border: 1.5px solid rgba(63,140,63,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .feature-star {
    color: #3F8C3F;
    font-size: 13px;
    line-height: 1;
  }

  .feature-text {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    color: rgba(248,243,238,0.8);
    line-height: 1.45;
  }

  .feature-text strong {
    color: #F8F3EE;
    font-weight: 600;
  }

  /* App store badges */
  .store-badges {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }

  .badge {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(248,243,238,0.08);
    border: 1.5px solid rgba(248,243,238,0.15);
    border-radius: 12px;
    padding: 10px 18px;
    cursor: pointer;
    transition: all 180ms cubic-bezier(0.22, 1, 0.36, 1);
    text-decoration: none;
  }

  .badge:hover {
    background: rgba(248,243,238,0.14);
    border-color: rgba(248,243,238,0.3);
    transform: translateY(-1px);
  }

  .badge-label {
    display: flex;
    flex-direction: column;
  }

  .badge-sub {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    color: rgba(248,243,238,0.55);
    letter-spacing: 0.02em;
  }

  .badge-name {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: #F8F3EE;
    letter-spacing: -0.01em;
  }

  /* ─── PHONE COLUMN ──────────────────────── */
  .phone-col {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  /* ─── PHONE FRAME ───────────────────────── */
  /* Height scales to fit viewport (nav 64 + section padding 48 + dots/label ~50 = ~162 reserved).
     Width keeps the 320:672 (≈0.476) bezel aspect ratio so internals stay correct. */
  .phone-bezel {
    height: min(672px, calc(100vh - 64px - 48px - 60px));
    aspect-ratio: 320 / 672;
    background: #0F0F0F;
    border-radius: 46px;
    padding: 10px;
    box-shadow:
      0 0 0 1px #2a2a2a,
      0 40px 100px rgba(0,0,0,0.55),
      0 12px 32px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.06);
    position: relative;
  }

  /* Side buttons */
  .phone-bezel::before {
    content: '';
    position: absolute;
    left: -3px;
    top: 100px;
    width: 3px;
    height: 36px;
    background: #1a1a1a;
    border-radius: 2px 0 0 2px;
    box-shadow: 0 48px 0 #1a1a1a, 0 96px 0 #1a1a1a;
  }

  .phone-bezel::after {
    content: '';
    position: absolute;
    right: -3px;
    top: 140px;
    width: 3px;
    height: 60px;
    background: #1a1a1a;
    border-radius: 0 2px 2px 0;
  }

  .phone-screen-wrap {
    width: 100%;
    height: 100%;
    border-radius: 38px;
    overflow: hidden;
    background: #fff;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* Status bar */
  .phone-status {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    flex-shrink: 0;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    z-index: 10;
    position: relative;
  }

  .phone-status.dark { background: #1D391A; color: #fff; }
  .phone-status.light { background: #fff; color: #14230E; }

  .sb-right { display: flex; gap: 5px; align-items: center; }
  .sb-bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 10px; }
  .sb-bars span { width: 3px; background: currentColor; border-radius: 1px; opacity: 0.85; }
  .sb-bars span:nth-child(1) { height: 3px; }
  .sb-bars span:nth-child(2) { height: 5px; }
  .sb-bars span:nth-child(3) { height: 7px; }
  .sb-bars span:nth-child(4) { height: 10px; }

  /* Screen slide area */
  .screen-slider {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  .screen-slide {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: none;
    opacity: 0;
    pointer-events: none;
    transition: opacity 420ms cubic-bezier(0.22, 1, 0.36, 1);
    will-change: opacity;
  }

  .screen-slide::-webkit-scrollbar { display: none; }
  .screen-slide.current { opacity: 1; pointer-events: auto; }
  .screen-slide.exiting { opacity: 0; }

  /* Tab bar */
  .phone-tabbar {
    display: flex;
    background: #fff;
    border-top: 0.5px solid #ececec;
    padding: 10px 0 4px;
    flex-shrink: 0;
  }

  .phone-tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    padding: 2px;
    transition: opacity 150ms;
  }

  .phone-tab-label {
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    font-weight: 600;
  }

  /* Home indicator */
  .home-indicator {
    height: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fff;
    flex-shrink: 0;
  }

  .home-bar {
    width: 120px;
    height: 4px;
    background: rgba(0,0,0,0.8);
    border-radius: 999px;
  }

  /* ─── SCREEN INDICATOR DOTS ─────────────── */
  .screen-indicators {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .dot {
    height: 6px;
    border-radius: 999px;
    background: rgba(248,243,238,0.3);
    transition: all 320ms cubic-bezier(0.22, 1, 0.36, 1);
    cursor: pointer;
  }

  .dot.active {
    background: #CBA258;
    width: 24px !important;
  }

  .screen-label-text {
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: rgba(248,243,238,0.45);
    margin-top: 2px;
  }

  /* Monstera decorative elements */
  .leaf-deco {
    position: absolute;
    opacity: 0.06;
    pointer-events: none;
  }

  @media (max-width: 900px) {
    .showcase-inner { flex-direction: column; gap: 60px; }
    .copy-col { text-align: left; }
    .subtext { max-width: 100%; }
    .feature-list { align-items: flex-start; }
    .store-badges { justify-content: flex-start; }
  }
</style>
</head>
<body>

<!-- ─── Shared Nav (matches index.html) ─── -->
<nav style="
  position: sticky; top: 0; z-index: 50;
  background: rgba(248,243,238,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid #E8E1D4;
  font-family: 'Archivo', sans-serif;
">
  <div style="max-width:1240px; margin:0 auto; padding:0 24px; height:64px; display:flex; align-items:center; justify-content:space-between;">
    <a href="index.html" style="font-family:'Archivo',sans-serif; font-weight:900; font-size:22px; letter-spacing:0.02em; color:#1D391A; text-decoration:none;">
      PLNTD<span style="font-size:11px; vertical-align:super; margin-left:2px; opacity:0.7; letter-spacing:0;">co.</span>
    </a>
    <div style="display:flex; gap:32px;">
      <a href="index.html#menu" style="font-family:'Archivo',sans-serif; font-weight:700; font-size:13px; letter-spacing:0.08em; text-transform:uppercase; color:#14230E; opacity:0.75; text-decoration:none;">Menu</a>
      <a href="story.html"      style="font-family:'Archivo',sans-serif; font-weight:700; font-size:13px; letter-spacing:0.08em; text-transform:uppercase; color:#14230E; opacity:0.75; text-decoration:none;">Our story</a>
      <a href="app.html"        style="font-family:'Archivo',sans-serif; font-weight:700; font-size:13px; letter-spacing:0.08em; text-transform:uppercase; color:#1D391A; text-decoration:none;">App</a>
    </div>
    <div style="width:40px;"></div>
  </div>
</nav>

<div id="root"></div>

<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// PLNTD theme
const T = {
  dark: '#1D391A', darkDeep: '#14230E', onDarkSoft: 'rgba(233,243,233,0.7)',
  surface: '#FFFFFF', cream: '#F8F3EE',
  ink: '#14230E', inkMuted: 'rgba(20,35,14,0.65)', inkFaint: 'rgba(20,35,14,0.4)',
  primary: '#1D391A', leaf: '#3F8C3F', leafSoft: '#E9F3E9', gold: '#CBA258',
  border: '#E8E1D4',
};

const APP_TABS = [
  { id: 'Home',    label: 'Home',    dark: true  },
  { id: 'Scan',    label: 'Scan',    dark: false },
  { id: 'Rewards', label: 'Rewards', dark: false },
  { id: 'Menu',    label: 'Menu',    dark: false },
];

const INTERVAL_MS = 3200;

function StatusBar({ dark }) {
  return (
    <div className={`phone-status ${dark ? 'dark' : 'light'}`}>
      <span>9:41</span>
      <div className="sb-right">
        <div className="sb-bars"><span/><span/><span/><span/></div>
        <span style={{ fontSize: '11px' }}>5G</span>
        <svg width="22" height="11" viewBox="0 0 22 11" style={{ opacity: 0.85 }}>
          <rect x="0" y="0" width="19" height="11" rx="3" fill="none" stroke="currentColor" strokeWidth="1.2"/>
          <rect x="19.5" y="3.5" width="2" height="4" rx="1" fill="currentColor"/>
          <rect x="1.5" y="1.5" width="14" height="8" rx="1.5" fill="currentColor"/>
        </svg>
      </div>
    </div>
  );
}

function TabBar({ activeScreen, onNavigate }) {
  const icons = {
    Home:    { active: 'home',   inactive: 'home'   },
    Scan:    { active: 'qr',     inactive: 'qr'     },
    Rewards: { active: 'star',   inactive: 'star-o' },
    Menu:    { active: 'menu',   inactive: 'menu'   },
  };
  return (
    <div className="phone-tabbar">
      {APP_TABS.map(tab => {
        const active = tab.id === activeScreen;
        const color = active ? T.leaf : '#8A8A8A';
        return (
          <div key={tab.id} className="phone-tab" onClick={() => onNavigate(tab.id)}>
            <Icon name={active ? icons[tab.id].active : icons[tab.id].inactive} size={22} color={color} />
            <span className="phone-tab-label" style={{ color }}>{tab.label}</span>
          </div>
        );
      })}
    </div>
  );
}

function PhoneShowcase() {
  const [activeIdx, setActiveIdx] = useState(0);
  const [prevIdx, setPrevIdx] = useState(null);
  const [paused, setPaused] = useState(false);
  const timerRef = useRef(null);

  const goTo = (idx) => {
    if (idx === activeIdx) return;
    setPrevIdx(activeIdx);
    setActiveIdx(idx);
  };

  const advance = () => {
    setActiveIdx(prev => {
      const next = (prev + 1) % APP_TABS.length;
      setPrevIdx(prev);
      return next;
    });
  };

  useEffect(() => {
    if (paused) return;
    timerRef.current = setInterval(advance, INTERVAL_MS);
    return () => clearInterval(timerRef.current);
  }, [paused]);

  // Clean up prevIdx after transition
  useEffect(() => {
    if (prevIdx === null) return;
    const timer = setTimeout(() => setPrevIdx(null), 550);
    return () => clearTimeout(timer);
  }, [activeIdx]);

  const activeTab = APP_TABS[activeIdx];

  const renderScreen = (id) => {
    const noop = () => {};
    switch(id) {
      case 'Home':    return <HomeScreen    t={T} onNavigate={noop} />;
      case 'Scan':    return <ScanScreen    t={T} onNavigate={noop} />;
      case 'Rewards': return <RewardsScreen t={T} onNavigate={noop} />;
      case 'Menu':    return <MenuScreen    t={T} onNavigate={noop} />;
      default:        return null;
    }
  };

  return (
    <section className="showcase-section">
      {/* Decorative monstera leaves */}
      <svg className="leaf-deco" style={{ top: -80, right: -60, width: 400, height: 400 }} viewBox="0 0 200 200">
        <path d="M100 20 Q150 40 160 80 Q170 120 140 145 Q110 170 80 160 Q50 155 40 130 Q25 100 40 70 Q55 40 100 20Z" fill="#F8F3EE"/>
        <line x1="100" y1="20" x2="90" y2="162" stroke="#1D391A" strokeWidth="2.5"/>
        <line x1="97" y1="70" x2="148" y2="90" stroke="#1D391A" strokeWidth="1.5"/>
        <line x1="95" y1="70" x2="45" y2="88" stroke="#1D391A" strokeWidth="1.5"/>
        <line x1="93" y1="110" x2="145" y2="125" stroke="#1D391A" strokeWidth="1.2"/>
        <line x1="93" y1="110" x2="44" y2="122" stroke="#1D391A" strokeWidth="1.2"/>
      </svg>
      <svg className="leaf-deco" style={{ bottom: -60, left: -40, width: 300, height: 300 }} viewBox="0 0 200 200">
        <path d="M100 20 Q150 40 160 80 Q170 120 140 145 Q110 170 80 160 Q50 155 40 130 Q25 100 40 70 Q55 40 100 20Z" fill="#F8F3EE"/>
        <line x1="100" y1="20" x2="90" y2="162" stroke="#1D391A" strokeWidth="2.5"/>
        <line x1="97" y1="70" x2="148" y2="90" stroke="#1D391A" strokeWidth="1.5"/>
        <line x1="95" y1="70" x2="45" y2="88" stroke="#1D391A" strokeWidth="1.5"/>
      </svg>

      <div className="showcase-inner">
        {/* ─── LEFT COPY ─── */}
        <div className="copy-col">
          <div className="eyebrow">PLNTD Rewards · Available now</div>
          <h2 className="headline">
            Earn. Scan.<br/><em>Drink free.</em>
          </h2>
          <p className="subtext">
            Show your QR at the till, earn 1 point per drink, and hit 10 for a drink on the house. It's that simple.
          </p>

          <ul className="feature-list">
            <li className="feature-item">
              <div className="feature-dot"><span className="feature-star">★</span></div>
              <span className="feature-text"><strong>1 point per drink</strong> — scan your QR each time you visit</span>
            </li>
            <li className="feature-item">
              <div className="feature-dot"><span className="feature-star">★</span></div>
              <span className="feature-text"><strong>10 points = free drink</strong> — any smoothie, juice or coffee on the menu</span>
            </li>
            <li className="feature-item">
              <div className="feature-dot"><span className="feature-star">★</span></div>
              <span className="feature-text"><strong>Browse the full menu</strong> — fresh juices & smoothies, made on-site daily</span>
            </li>
          </ul>

          <div className="store-badges">
            {/* Apple App Store badge */}
            <a href="#" className="badge">
              <svg width="24" height="28" viewBox="0 0 814 1000" fill="#F8F3EE">
                <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-42.3-150.3-109.7C45.1 710.7 1 547.8 1 389.8c0-248.3 160.7-379.4 319.1-379.4 84.2 0 154.4 55.5 207.3 55.5 50.6 0 130.1-58.8 226.8-58.8 35.8 0 138.1 3.2 209.4 117.8z"/>
                <path d="M549.8 99.8c15.5-20.3 26.4-48.8 26.4-77.3 0-3.8-.3-7.7-.9-11.5C545.1 12.8 491 36 457.1 72.3c-13.5 14.5-26.9 37.3-26.9 66.2 0 4.1.6 8.3 1 9.7 1.7.3 4.5.7 7.3.7 27.1 0 59.4-18.3 111.3-48.9z"/>
              </svg>
              <div className="badge-label">
                <span className="badge-sub">Download on the</span>
                <span className="badge-name">App Store</span>
              </div>
            </a>
            {/* Google Play badge */}
            <a href="#" className="badge">
              <svg width="24" height="26" viewBox="0 0 512 512">
                <path d="M48 432L284 256 48 80v352z" fill="#EA4335"/>
                <path d="M48 80l236 176 68-50.8L96 48C76 36.5 56 49.3 48 80z" fill="#FBBC04"/>
                <path d="M48 432c8 30.7 28 43.5 48 32l256-187.2-68-50.8L48 432z" fill="#34A853"/>
                <path d="M400.6 223.2L352 192l-68 64 68 50.8 49.4-32c22.4-14.5 22.4-37.1.2-51.6z" fill="#4285F4"/>
              </svg>
              <div className="badge-label">
                <span className="badge-sub">Get it on</span>
                <span className="badge-name">Google Play</span>
              </div>
            </a>
          </div>
        </div>

        {/* ─── PHONE ─── */}
        <div className="phone-col"
          onMouseEnter={() => setPaused(true)}
          onMouseLeave={() => setPaused(false)}
        >
          <div className="phone-bezel">
            <div className="phone-screen-wrap">
              <StatusBar dark={activeTab.dark} />

              <div className="screen-slider">
                {APP_TABS.map((tab, idx) => {
                  let cls = 'screen-slide';
                  if (idx === activeIdx) cls += ' current';
                  else if (idx === prevIdx) cls += ' exiting';
                  return (
                    <div key={tab.id} className={cls}>
                      {renderScreen(tab.id)}
                    </div>
                  );
                })}
              </div>

              <TabBar activeScreen={activeTab.id} onNavigate={(id) => { goTo(APP_TABS.findIndex(tab => tab.id === id)); setPaused(true); setTimeout(() => setPaused(false), 6000); }} />
              <div className="home-indicator"><div className="home-bar"></div></div>
            </div>
          </div>

          {/* Dots + label */}
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '10px' }}>
            <div className="screen-indicators">
              {APP_TABS.map((tab, idx) => (
                <div
                  key={tab.id}
                  className={`dot${idx === activeIdx ? ' active' : ''}`}
                  style={{ width: idx === activeIdx ? '24px' : '6px' }}
                  onClick={() => { goTo(idx); setPaused(true); setTimeout(() => setPaused(false), 6000); }}
                />
              ))}
            </div>
            <div className="screen-label-text">{activeTab.label}</div>
          </div>
        </div>
      </div>
    </section>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<PhoneShowcase />);
</script>
</body>
</html>
