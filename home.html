<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLNTD — Home</title>
<meta name="description" content="Plant-powered cold-pressed juices and drinks. Fresh, real, alive.">
<link rel="icon" type="image/png" href="assets/icon.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --btn-scale: 1.08; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow-x: hidden; }

  body {
    font-family: 'Archivo', system-ui, sans-serif;
    overflow: hidden;
    background: #F8F3EE;
  }

  .page {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 600px;
    overflow: hidden;
    background: #F8F3EE;
  }

  /* ── VIDEO LAYER (the Seedance render) ── */
  #liquidVideo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center bottom;
    z-index: 1;
    pointer-events: none;
  }

  /* ── SETTLED FLAT FILL ──
     When the pour finishes, this fades in over the rippling video surface:
     a flat-topped juice gradient that fills from a fixed rest line (just
     under the nav) down to the bottom. Gives a clean horizontal waterline
     on every viewport, with a subtle meniscus highlight on top. */
  .settled-liquid {
    position: absolute;
    left: 0; right: 0;
    top: 100%;                        /* collapsed until frozen; JS sets top */
    bottom: 0;
    z-index: 1;
    background: linear-gradient(
      to bottom,
      #5d7651 0%,
      #43583a 12%,
      #2d3c22 45%,
      #1f2c16 100%
    );
    box-shadow:
      inset 0 2px 0 rgba(196, 228, 168, 0.45),   /* meniscus highlight */
      0 -2px 8px rgba(20, 30, 14, 0.22);          /* soft lip shadow */
    opacity: 0;
    transition: opacity 520ms cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
  }
  .settled-liquid.visible { opacity: 1; }

  .grain {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: 0.35;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
  }

  /* cream mask strip — hides the part of the video above the nav line
     so the liquid never visually crosses the nav. */
  .nav-mask {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 88px;
    z-index: 3;
    pointer-events: none;
    background: linear-gradient(
      to bottom,
      #F8F3EE 0%,
      #F8F3EE 64%,
      rgba(248, 243, 238, 0.82) 85%,
      rgba(248, 243, 238, 0) 100%
    );
  }

  /* ── TOP NAV ── */
  .nav {
    position: absolute; top: 0; left: 0; right: 0;
    z-index: 6;
    display: flex; align-items: center; justify-content: space-between;
    padding: 26px 48px;
  }
  .nav-logo {
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 0.02em;
    text-decoration: none;
    color: #2A3623;
  }
  .nav-logo .co { font-size: 12px; vertical-align: baseline; margin-left: 3px; letter-spacing: 0; opacity: 0.7; font-weight: 700; }
  .nav-links { display: flex; gap: 32px; }
  .nav-links a {
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    color: rgba(42,54,35,0.62);
    transition: opacity 160ms ease;
  }
  .nav-links a:hover { opacity: 0.6; }

  /* ── HERO CONTENT ── */
  .hero-content {
    position: relative;
    z-index: 5;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .headline {
    font-weight: 900;
    font-size: clamp(64px, 13vw, 190px);
    line-height: 0.92;
    letter-spacing: -0.015em;
    text-transform: uppercase;
    color: #2A3623;
    margin-bottom: 54px;
    transition: color 250ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .headline .co {
    font-size: 0.42em;
    vertical-align: baseline;
    opacity: 0.9;
    margin-left: 0.04em;
    letter-spacing: -0.02em;
    font-weight: 900;
  }

  .cta-stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: calc(9px * var(--btn-scale, 1));
    min-width: calc(230px * var(--btn-scale, 1));
    font-family: 'Archivo', system-ui, sans-serif;
    font-weight: 700;
    font-size: calc(14px * var(--btn-scale, 1));
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: none;
    border-radius: 999px;
    padding: calc(18px * var(--btn-scale, 1)) calc(38px * var(--btn-scale, 1));
    cursor: pointer;
    text-decoration: none;
    transition: transform 180ms cubic-bezier(0.22,1,0.36,1);
  }
  .btn:focus-visible { outline: 3px solid #2A3623; outline-offset: 3px; }
  .btn-menu {
    color: #2A3623;
    background: #F4F6EE;
    box-shadow: 0 14px 34px rgba(40,55,30,0.18);
  }
  .btn-app {
    color: #F2F4EC;
    background: #2A3623;
    box-shadow: 0 14px 34px rgba(20,30,12,0.3);
    border: 1.5px solid rgba(242,244,236,0.16);
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-app svg { width: calc(16px * var(--btn-scale, 1)); height: calc(16px * var(--btn-scale, 1)); }


  /* ── HAMBURGER ── */
  .nav-hamburger { display: none; width: 40px; height: 40px; border-radius: 999px; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; color: #2A3623; transition: background 120ms; }
  .nav-hamburger svg { width: 22px; height: 22px; }
  .nav-hamburger:hover { background: rgba(42,54,35,0.1); }

  /* ── MOBILE DRAWER ── */
  .mobile-nav-overlay { position: fixed; inset: 0; background: rgba(20,35,14,0.4); z-index: 100; opacity: 0; pointer-events: none; transition: opacity 240ms cubic-bezier(0.22,1,0.36,1); }
  .mobile-nav-overlay.open { opacity: 1; pointer-events: auto; }
  .mobile-nav-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 300px; max-width: 85vw; background: #F8F3EE; z-index: 101; transform: translateX(100%); transition: transform 240ms cubic-bezier(0.22,1,0.36,1); display: flex; flex-direction: column; box-shadow: -8px 0 32px rgba(0,0,0,0.12); }
  .mobile-nav-drawer.open { transform: translateX(0); }
  .mobile-nav-head { padding: 0 20px; height: 64px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E8E1D4; }
  .mobile-nav-close { width: 40px; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; color: #2A3623; }
  .mobile-nav-close svg { width: 22px; height: 22px; }
  .mobile-nav-links { display: flex; flex-direction: column; padding: 8px 24px; }
  .mobile-nav-links a { font-family: 'Archivo', system-ui, sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 0.05em; text-transform: uppercase; color: #2A3623; padding: 20px 0; border-bottom: 1px solid #E8E1D4; text-decoration: none; transition: color 120ms; }
  .mobile-nav-links a:last-child { border-bottom: 0; }
  .mobile-nav-links a:hover { color: #1D391A; }

  /* ── MOBILE ── */
  @media (max-width: 640px) {
    .nav { padding: 20px 24px; }
    .nav-links { display: none; }
    .nav-hamburger { display: flex; }
  }

  /* ── REDUCED MOTION ── */
  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>

<div class="page" id="page">
  <video id="liquidVideo" src="assets/video/juice-pour.mp4"
         autoplay muted playsinline preload="auto" aria-hidden="true"></video>
  <div class="settled-liquid" id="settledLiquid"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="nav-mask" aria-hidden="true"></div>

  <nav class="nav">
    <a class="nav-logo" href="/">PLNTD<span class="co">co.</span></a>
    <div class="nav-links">
      <a href="/menu">Menu</a>
      <a href="/story">Our Story</a>
      <a href="/app">App</a>
    </div>
    <button class="nav-hamburger" aria-label="Open menu" onclick="document.getElementById('mobileNav').classList.add('open');document.getElementById('mobileNavOverlay').classList.add('open');">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
  </nav>

  <div class="mobile-nav-overlay" id="mobileNavOverlay" onclick="document.getElementById('mobileNav').classList.remove('open');this.classList.remove('open');"></div>
  <aside class="mobile-nav-drawer" id="mobileNav">
    <div class="mobile-nav-head">
      <a href="/" class="nav-logo">PLNTD<span class="co">co.</span></a>
      <button class="mobile-nav-close" aria-label="Close menu" onclick="document.getElementById('mobileNav').classList.remove('open');document.getElementById('mobileNavOverlay').classList.remove('open');">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M6 18L18 6"/></svg>
      </button>
    </div>
    <nav class="mobile-nav-links">
      <a href="/menu">Menu</a>
      <a href="/story">Our Story</a>
      <a href="/app">App</a>
    </nav>
  </aside>

  <div class="hero-content">
    <h1 class="headline" id="headline">PLNTD<span class="co">co.</span></h1>
    <div class="cta-stack">
      <a class="btn btn-menu" href="/menu">See the Menu</a>
      <a class="btn btn-app" href="https://www.google.com/maps/search/?api=1&query=PLNTD%20Co%2C%20144%20High%20Road%20Leyton%2C%20London%20E15%202BX" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        Find Us
      </a>
    </div>
  </div>

</div>

<script>
  const v        = document.getElementById('liquidVideo');
  const headline = document.getElementById('headline');
  const settled  = document.getElementById('settledLiquid');

  const INK_DARK  = [42, 54, 35];    // #2A3623
  const INK_CREAM = [242, 244, 236]; // #F2F4EC

  // ── REST LEVEL ────────────────────────────────────────────────
  // Where the liquid should settle, as a fraction of viewport height
  // from the TOP (0 = top under the nav, 1 = bottom). 0.08 ≈ just below
  // the nav (almost full). If the clip ends before reaching it, we freeze
  // at the final waterline anyway (see the end fallback in tick()).
  let TARGET_LEVEL = 0.08;
  let frozen = false;

  function lerp(a, b, t) { return a + (b - a) * t; }
  function rgb(c) { return `rgb(${c[0]|0}, ${c[1]|0}, ${c[2]|0})`; }
  function lerpRGB(a, b, t) { return [lerp(a[0],b[0],t), lerp(a[1],b[1],t), lerp(a[2],b[2],t)]; }

  // Offscreen buffer used to read the video's real pixels so we can find
  // the actual waterline (cream → green transition) on screen.
  const buf = document.createElement('canvas');
  const bctx = buf.getContext('2d', { willReadFrequently: true });
  const SAMPLE_W = 24;          // we only need one column-ish strip
  let SAMPLE_H = 240;

  function sizeBuffer() {
    SAMPLE_H = Math.max(160, Math.round(window.innerHeight / 4));
    buf.width = SAMPLE_W;
    buf.height = SAMPLE_H;
  }
  sizeBuffer();
  window.addEventListener('resize', sizeBuffer);

  // Draw the video into the buffer using the SAME object-fit:cover +
  // object-position:center bottom mapping the <video> uses, so buffer
  // rows map linearly to screen rows.
  function drawCover() {
    const W = SAMPLE_W, H = SAMPLE_H;
    const vw = v.videoWidth || 16, vh = v.videoHeight || 9;
    const s = Math.max(W / vw, H / vh);
    const dw = vw * s, dh = vh * s;
    const dx = (W - dw) / 2;     // center horizontally
    const dy = H - dh;           // bottom aligned
    bctx.clearRect(0, 0, W, H);
    bctx.drawImage(v, dx, dy, dw, dh);
  }

  // Scan the buffer column from top to bottom; return the waterline as a
  // fraction of height (0..1) — the top of the first RUN of consecutive
  // liquid rows (so a thin surface glint/foam highlight can't trigger it
  // ~tens of px above the real juice body). Returns 1 if none found.
  const RUN = 6;
  function detectWaterlineFrac() {
    const W = SAMPLE_W, H = SAMPLE_H;
    let data;
    try { data = bctx.getImageData(0, 0, W, H).data; }
    catch (e) { return null; } // not ready / tainted
    const cx = (W >> 1);
    let run = 0, start = -1;
    for (let y = 0; y < H; y++) {
      let r = 0, g = 0, b = 0, n = 0;
      // average a few px across the middle of the strip for stability
      for (let x = cx - 3; x <= cx + 3; x++) {
        const i = (y * W + x) * 4;
        r += data[i]; g += data[i+1]; b += data[i+2]; n++;
      }
      r /= n; g /= n; b /= n;
      const lum = 0.2126*r + 0.7152*g + 0.0722*b;
      // solid juice: clearly green and clearly darker than the cream above
      const isLiquid = (g >= r - 4) && (g > b * 0.9) && (lum < 170);
      if (isLiquid) {
        if (run === 0) start = y;
        if (++run >= RUN) return start / H;
      } else {
        run = 0;
      }
    }
    return 1; // no liquid found → fully cream
  }

  let lastWaterFrac = 1;

  // Settle: fade the flat juice fill in over the rippling video surface.
  // The rest line sits just under the nav (mask is 88px), so the flat
  // waterline reads as "filled almost to the top".
  // px from the top — the flat fill's top edge. Tucked up into the nav
  // mask's fade zone so the video's wavy surface can't peek out above it;
  // the mask softens the very top into a clean waterline just under the nav.
  const REST_Y = 70;
  function freezeFlat() {
    settled.style.top = REST_Y + 'px';
    requestAnimationFrame(() => settled.classList.add('visible'));
  }

  function tick() {
    // 1) find the real waterline from the video pixels
    if (v.readyState >= 2) {
      drawCover();
      const wf = detectWaterlineFrac();
      if (wf != null) lastWaterFrac = wf;
    }
    const waterlineY = frozen ? REST_Y : lastWaterFrac * window.innerHeight;

    // 2) freeze the clip once the liquid reaches the target rest level —
    //    or when the clip is about to end, whichever comes first.
    const nearEnd = v.duration && v.currentTime >= v.duration - 0.12;
    if (!frozen && v.currentTime > 0.2 && (lastWaterFrac <= TARGET_LEVEL || nearEnd)) {
      v.pause();
      frozen = true;
      freezeFlat();
    }

    // 3) recolor the headline based on where the liquid ACTUALLY is:
    //    dark while above the waterline, cream once submerged, with a
    //    soft crossfade band right at the surface.
    const hl = headline.getBoundingClientRect();
    const hlY = hl.top + hl.height / 2;
    const BAND = 90;
    let p = (hlY - waterlineY) / BAND + 0.5;
    p = Math.max(0, Math.min(1, p));
    headline.style.color = rgb(lerpRGB(INK_DARK, INK_CREAM, p));

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ── REDUCED MOTION — skip the pour, jump to the filled rest state ──
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    v.removeAttribute('autoplay');
    const goFilled = () => { v.pause(); v.currentTime = Math.max(0, v.duration - 0.05); };
    if (v.readyState >= 1 && v.duration) goFilled();
    else v.addEventListener('loadedmetadata', goFilled, { once: true });
  }
</script>

</body>
</html>
