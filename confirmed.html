<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Account confirmed — PLNTD</title>
<link rel="icon" type="image/png" href="assets/icon.png?v=2" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800;9..144,900&family=Archivo:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #F8F3EE;
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 24px;
    text-align: center;
  }
  .brand {
    font-family: 'Archivo', sans-serif;
    font-weight: 900;
    font-size: 26px;
    letter-spacing: 0.02em;
    color: #1D391A;
    margin-bottom: 40px;
  }
  .brand span { font-size: 13px; opacity: 0.7; margin-left: 2px; }
  .check {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: #E9F3E9;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
    animation: pop 420ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .check svg { width: 48px; height: 48px; }
  @keyframes pop {
    0% { transform: scale(0.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: clamp(32px, 7vw, 44px);
    color: #14230E;
    letter-spacing: -0.02em;
    margin-bottom: 14px;
  }
  p {
    font-size: 16px;
    color: rgba(20, 35, 14, 0.65);
    line-height: 1.6;
    max-width: 420px;
    margin-bottom: 36px;
  }
  .steps {
    background: #FFFFFF;
    border: 1px solid #E8E1D4;
    border-radius: 16px;
    padding: 20px 24px;
    max-width: 420px;
    width: 100%;
    text-align: left;
    margin-bottom: 36px;
  }
  .step { display: flex; align-items: flex-start; gap: 12px; padding: 8px 0; }
  .step-num {
    width: 24px; height: 24px; border-radius: 50%;
    background: #1D391A; color: #F8F3EE;
    font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 12px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    margin-top: 1px;
  }
  .step-text { font-size: 15px; color: #14230E; line-height: 1.5; }
  .foot {
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.25em;
    color: rgba(20, 35, 14, 0.4);
  }
</style>
</head>
<body>
  <div class="brand">PLNTD<span>co.</span></div>

  <div class="check">
    <svg viewBox="0 0 24 24" fill="none" stroke="#3F8C3F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6L9 17l-5-5"/>
    </svg>
  </div>

  <h1>Account confirmed</h1>
  <p>Your email is verified and your PLNTD Rewards account is ready. You can close this page.</p>

  <div class="steps">
    <div class="step">
      <div class="step-num">1</div>
      <div class="step-text">Open the <strong>PLNTD</strong> app on your phone</div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div class="step-text">Sign in with your email and password</div>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <div class="step-text">Show your QR at the till to start earning points</div>
    </div>
  </div>

  <div class="foot">Eat clean · Live green · Feel good</div>
</body>
</html>
