<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLNTD — Real Fruit, Real Cold-Pressed</title>
<link rel="icon" type="image/png" href="assets/icon.png?v=2" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow-x: hidden; }

  body {
    font-family: 'Archivo', system-ui, sans-serif;
    overflow: hidden;
    background: #F8F3EE;
  }

  .page {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 600px;
    overflow: hidden;
    background: #F8F3EE;
    transition: background 600ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* ── VIDEO LAYER (the Seedance render) ── */
  #liquidVideo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center bottom;
    z-index: 1;
    pointer-events: none;
  }

  /* paper grain — unifies video + page so they feel like one surface */
  .grain {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: 0.35;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
  }

  /* cream mask strip — hides the part of the video above the nav line
     so the liquid never visually crosses the nav. Gradient fade at the
     bottom edge keeps it from looking like a hard horizon. */
  .nav-mask {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 110px;
    z-index: 3;
    pointer-events: none;
    background: linear-gradient(
      to bottom,
      #F8F3EE 0%,
      #F8F3EE 70%,
      rgba(248, 243, 238, 0.85) 88%,
      rgba(248, 243, 238, 0) 100%
    );
  }

  /* ── TOP NAV (stays above waterline) ── */
  .nav {
    position: absolute; top: 0; left: 0; right: 0;
    z-index: 6;
    display: flex; align-items: center; justify-content: space-between;
    padding: 26px 48px;
  }
  .nav-logo {
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 0.02em;
    text-decoration: none;
    color: #2A3623;
  }
  .nav-logo .co { font-size: 11px; vertical-align: super; margin-left: 2px; letter-spacing: 0; opacity: 0.7; font-weight: 700; }
  .nav-links { display: flex; gap: 32px; }
  .nav-links a {
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    color: rgba(42,54,35,0.62);
    transition: opacity 160ms ease;
  }
  .nav-links a:hover { opacity: 0.6; }

  /* ── HERO CONTENT ── */
  .hero-content {
    position: relative;
    z-index: 5;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 0;
  }

  .headline {
    font-weight: 900;
    font-size: clamp(64px, 13vw, 190px);
    line-height: 0.92;
    letter-spacing: -0.015em;
    text-transform: uppercase;
    color: #2A3623;
    margin-bottom: 54px;
    transition: color 250ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .headline .co {
    font-size: 0.42em;
    vertical-align: baseline;
    opacity: 0.9;
    margin-left: 0.04em;
    letter-spacing: -0.02em;
    font-weight: 900;
  }

  .cta-stack {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: calc(9px * var(--btn-scale, 1.08));
    min-width: calc(230px * var(--btn-scale, 1.08));
    font-weight: 700;
    font-size: calc(14px * var(--btn-scale, 1.08));
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: none;
    border-radius: 999px;
    padding: calc(18px * var(--btn-scale, 1.08)) calc(38px * var(--btn-scale, 1.08));
    cursor: pointer;
    text-decoration: none;
    transition: transform 180ms cubic-bezier(0.22,1,0.36,1);
  }
  .btn-menu {
    color: #2A3623;
    background: #F4F6EE;
    box-shadow: 0 14px 34px rgba(40,55,30,0.18);
  }
  .btn-app {
    color: #F2F4EC;
    background: #2A3623;
    box-shadow: 0 14px 34px rgba(20,30,12,0.3);
    border: 1.5px solid rgba(242,244,236,0.16);
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-app svg { width: calc(16px * var(--btn-scale, 1.08)); height: calc(16px * var(--btn-scale, 1.08)); }

  /* ── REPLAY ── */
  .replay {
    position: fixed;
    bottom: 26px; right: 26px;
    z-index: 8;
    display: inline-flex; align-items: center; gap: 7px;
    background: rgba(42,54,35,0.08);
    border: 1px solid rgba(42,54,35,0.2);
    color: #2A3623;
    padding: 9px 18px;
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 999px;
    backdrop-filter: blur(6px);
  }
  .replay:hover { background: rgba(42,54,35,0.16); }

  @media (max-width: 640px) {
    .nav { padding: 18px 22px; }
    .nav-links { gap: 18px; }
  }
</style>
</head>
<body>

<div class="page" id="page">
  <video id="liquidVideo" src="assets/video/juice-pour.mp4"
         autoplay muted playsinline preload="auto" aria-hidden="true"></video>
  <div class="grain"></div>
  <div class="nav-mask"></div>

  <nav class="nav">
    <a class="nav-logo" id="navLogo" href="landing.html">PLNTD<span class="co">co.</span></a>
    <div class="nav-links">
      <a href="index.html">Menu</a>
      <a href="story.html">Our Story</a>
      <a href="index.html">App</a>
    </div>
  </nav>

  <div class="hero-content">
    <h1 class="headline" id="headline">PLNTD<span class="co">co.</span></h1>
    <div class="cta-stack">
      <a class="btn btn-menu" href="index.html">See the Menu</a>
      <a class="btn btn-app" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        Find Us
      </a>
    </div>
  </div>

  <button class="replay" id="replay">↺ Replay</button>
</div>

<script>
  const v        = document.getElementById('liquidVideo');
  const headline = document.getElementById('headline');
  const replay   = document.getElementById('replay');

  const INK_DARK  = [42, 54, 35];    // #2A3623
  const INK_CREAM = [242, 244, 236]; // #F2F4EC

  function lerp(a, b, t) { return a + (b - a) * t; }
  function rgb(c) { return `rgb(${c[0]|0}, ${c[1]|0}, ${c[2]|0})`; }
  function lerpRGB(a, b, t) { return [lerp(a[0],b[0],t), lerp(a[1],b[1],t), lerp(a[2],b[2],t)]; }

  // Sync the headline color to the rising waterline.
  // The mask hides anything above ~110px from the top, so the effective
  // visible waterline ends at ~110px (not 15% of viewport).
  const NAV_MASK_PX = 110;
  function tick() {
    if (v.duration && v.duration > 0) {
      const prog = Math.min(1, v.currentTime / v.duration);
      const startY = window.innerHeight;          // empty: waterline at bottom
      const endY   = NAV_MASK_PX + 10;            // full:  waterline just under the mask
      const waterlineY = startY + (endY - startY) * prog;

      // headline center y
      const hl = headline.getBoundingClientRect();
      const hlY = hl.top + hl.height / 2;

      // soft band: -110px above waterline = dark, +110px below = cream
      const BAND = 110;
      let p = (hlY - waterlineY) / BAND + 0.5;
      p = Math.max(0, Math.min(1, p));
      headline.style.color = rgb(lerpRGB(INK_DARK, INK_CREAM, p));
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // Hold the final frame. The Seedance clip's tail isn't pure-ripple
  // (it's still rising), so looping it makes the liquid visibly drop.
  v.addEventListener('ended', () => { v.pause(); });

  replay.addEventListener('click', () => {
    v.currentTime = 0;
    v.play();
  });
</script>

</body>
</html>
